name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build search index (data/ -> site/)
        run: python3 scripts/build_index.py
      - name: Validate distilled schema (url required on every record)
        run: python3 scripts/validate_distilled.py
      - name: Search acceptance (docs + threads + distilled)
        run: node scripts/search_check.mjs
      - name: Verify static site artifacts exist
        run: |
          test -f site/index.html
          test -f site/style.css
          test -f site/search.js
          test -f site/search-index.json
          test -f site/search-data.js
          test "$(find site/docs -name '*.html' | wc -l)" -ge 6
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site
          path: site/
          if-no-files-found: error

  # Deploys site/ to Cloudflare Pages on every main push. Fully gated on the
  # CLOUDFLARE_API_TOKEN repo secret — when the secret is absent the deploy
  # steps are skipped and everything stays ready-to-deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site
          path: site
      - name: CF token missing - manual setup step
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CF token secret not set - deploy skipped (manual gate)."
      - name: Deploy site to Cloudflare Pages (aaps-atlas)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4.129.0 pages deploy site --project-name aaps-atlas
