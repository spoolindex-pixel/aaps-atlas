name: auto-pr
# F-17: push -> PR is atomic at the forge layer. Any push to a feat/task-*
# branch immediately gets a PR (if none exists). Agent-proof: forgetting the
# PR step can no longer hide finished work.
on:
  push:
    branches:
      - 'feat/task-**'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: auto-pr-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR if none exists for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="${{ github.ref_name }}"
          EXISTING=$(gh pr list --head "$BR" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BR — nothing to do"
            exit 0
          fi
          TITLE=$(git log -1 --pretty=%s)
          BODY="Auto-opened by the auto-pr bot: branch \`$BR\` was pushed but no PR existed (F-17 — push→PR atomicity). CI runs on this PR as normal."
          if gh pr create --head "$BR" --base main --title "$TITLE" --body "$BODY"; then
            echo "PR opened for $BR"
          else
            echo "pr create did not succeed (empty diff or race) — leaving for stranded-pr-sweep"
          fi
